# Model CI/CD (#112, ADR-028): train, evaluate, gate, and on main register and set the
# champion. PR 2 runs it on stub steps (Model-Development/scripts/steps); PR 3 swaps the
# step contents without changing this file's shape. No GCP, no secret except the Slack
# webhook, which only the notify step sees.
#
# The workflow runs on every pull request, so the check always reports. The `changes`
# job finds out whether model files changed (Model-Development/, this file, or
# Data-Pipeline/dvc.lock, since a new data version should retrain): a PR is diffed
# against its base, a push to main against the previous head (github.event.before),
# and a diff that cannot be computed, such as after a force push, runs the pipeline
# anyway. A dispatch always runs. `pipeline` runs only when `changes` says so, and `model-ci`
# (always runs) is the one required status check: a skipped `pipeline` passes it, a
# failed `changes` fails it. Do not require `pipeline` itself (a skipped required job
# counts as passed, which would hide a failed `changes`).
#
# A pull request runs up to the gates. A push to main also runs the champion re-score,
# the reload check, the registry push and the champion step.
#
# workflow_dispatch works only once this file is on main (GitHub reads the dispatch
# trigger from the default branch). stub_outcome picks the stub result: pass, fail_gate
# or fail_pipeline.

name: Model

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stub_outcome:
        description: Result the stub steps produce
        type: choice
        options: [pass, fail_gate, fail_pipeline]
        default: pass

permissions:
  contents: read

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect model changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      model: ${{ steps.diff.outputs.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did model files change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A dispatch always runs.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "model=true" >> "$GITHUB_OUTPUT"
            echo "dispatch: always run"
            exit 0
          fi
          # A PR compares its merge commit (the checkout) with the base, which lists exactly
          # the PR's files. A push compares the new head with the previous one. If the diff
          # cannot be computed (a new branch, or a force push that dropped the old commit),
          # run anyway.
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; else BASE="$PUSH_BEFORE"; fi
          if ! git diff --name-only "$BASE" HEAD > changed.txt; then
            echo "model=true" >> "$GITHUB_OUTPUT"
            echo "Cannot diff $EVENT against '$BASE': run anyway"
            exit 0
          fi
          cat changed.txt
          if grep -qE '^(Model-Development/|\.github/workflows/model\.yml$|Data-Pipeline/dvc\.lock$)' changed.txt; then
            echo "model=true" >> "$GITHUB_OUTPUT"
          else
            echo "model=false" >> "$GITHUB_OUTPUT"
            echo "No model files changed: the pipeline is skipped"
          fi

  pipeline:
    name: Train, evaluate, gate
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: brt-train:ci
      STUB_OUTCOME: ${{ github.event.inputs.stub_outcome || 'pass' }}
      # The main-only steps: a push or a dispatch on main, never a pull request.
      MAIN_RUN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the training image
        run: |
          docker build -f Model-Development/Dockerfile -t "$IMAGE" .
          mkdir artifacts
          # For #111's registry record: the local image ID until PR 3 pushes to Artifact
          # Registry, then the registry digest.
          docker image inspect --format '{{.Id}}' "$IMAGE" > artifacts/image_digest.txt

      # Every step below runs in the image with artifacts/ mounted, as the runner user so
      # the files are the runner's to upload. A step stops the job at its first failure.
      - name: Pull data
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e STUB_OUTCOME -e GITHUB_SHA
          -v "$PWD/artifacts:/app/artifacts" "$IMAGE"
          python Model-Development/scripts/steps/step_pull_data.py --artifacts artifacts

      - name: Train
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e STUB_OUTCOME
          -v "$PWD/artifacts:/app/artifacts" "$IMAGE"
          python Model-Development/scripts/steps/step_train.py --artifacts artifacts

      - name: Evaluate
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e STUB_OUTCOME
          -v "$PWD/artifacts:/app/artifacts" "$IMAGE"
          python Model-Development/scripts/steps/step_evaluate.py --artifacts artifacts

      - name: Re-score the champion (main only)
        if: env.MAIN_RUN == 'true'
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e STUB_OUTCOME
          -v "$PWD/artifacts:/app/artifacts" "$IMAGE"
          python Model-Development/scripts/steps/step_rescore_champion.py --artifacts artifacts

      # gates.py exits 0 (promote or keep the champion), 1 (a gate failed) or 2 (cannot
      # evaluate). The exit code is kept as a step output for the Slack message.
      - name: Gates
        id: gates
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/artifacts:/app/artifacts" "$IMAGE" \
            python Model-Development/scripts/gates.py \
            --metrics artifacts/metrics.json --out artifacts/gate_report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          [ -f artifacts/gate_report.json ] && cat artifacts/gate_report.json
          exit "$code"

      - name: Reload check (main only)
        if: env.MAIN_RUN == 'true'
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e STUB_OUTCOME
          -v "$PWD/artifacts:/app/artifacts" "$IMAGE"
          python Model-Development/scripts/steps/step_reload_check.py --artifacts artifacts

      - name: Registry push (main only)
        if: env.MAIN_RUN == 'true'
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e STUB_OUTCOME
          -v "$PWD/artifacts:/app/artifacts" "$IMAGE"
          python Model-Development/scripts/steps/step_registry_push.py --artifacts artifacts

      - name: Set champion (main only)
        if: env.MAIN_RUN == 'true'
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e STUB_OUTCOME
          -v "$PWD/artifacts:/app/artifacts" "$IMAGE"
          python Model-Development/scripts/steps/step_set_champion.py --artifacts artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-artifacts
          path: artifacts/
          if-no-files-found: ignore

      # Last step, on the runner (the one step outside the image). The webhook secret is
      # exposed to this step only. Empty (no secret yet, or a fork PR): a warning, exit 0.
      - name: Notify Slack
        if: always()
        env:
          SLACK_ALERT_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          GATES_EXIT: ${{ steps.gates.outputs.exit_code }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=()
          if [ "$MAIN_RUN" = "true" ]; then args+=(--main); fi
          python3 Model-Development/scripts/steps/step_notify.py \
            --artifacts artifacts --repo "$GITHUB_REPOSITORY" --ref "$REF_NAME" \
            --run-url "$RUN_URL" --job-status "$JOB_STATUS" --gates-exit "$GATES_EXIT" \
            "${args[@]}"

  # The required status check. Always runs, so it reports on every pull request.
  model-ci:
    name: model-ci
    if: always()
    needs: [changes, pipeline]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Aggregate the result
        env:
          CHANGES: ${{ needs.changes.result }}
          MODEL: ${{ needs.changes.outputs.model }}
          PIPELINE: ${{ needs.pipeline.result }}
        run: |
          echo "changes=$CHANGES model_changed=$MODEL pipeline=$PIPELINE"
          # failure or cancelled in either job fails; otherwise the pipeline must have
          # succeeded, or been skipped because no model file changed.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes job: $CHANGES"; exit 1
          fi
          if [ "$MODEL" = "true" ]; then
            [ "$PIPELINE" = "success" ] || { echo "::error::pipeline job: $PIPELINE"; exit 1; }
          else
            [ "$PIPELINE" = "skipped" ] || { echo "::error::pipeline job: $PIPELINE"; exit 1; }
          fi
