# CI v1 (#21): lint and tests on every pull request and every push to main.
# Lint runs on Python 3.12 from .python-version (ADR-013). The tests run with the
# documented test command (#38), in the Airflow image, so the DAG tests have
# Airflow and cannot skip. No secrets: the job reads nothing from the
# repository's secrets, the test container gets no keys and no network, and
# tests/conftest.py blocks network access so tests use fixture files only. The
# job name `Lint and test (Python 3.12)` is the required status check on main
# until the repo admin switches it to the `ci` aggregator job below (runbook, "CI").
#
# Speed (#165): the tests run in parallel (run_tests.sh), and a pull request tests
# only the component folders its changes reach (.github/scripts/test_scope.py). Main,
# and a change to any shared file, still runs every test with both coverage bars. The
# Terraform job checks both roots' format and syntax with no cloud calls.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the scope step can diff a pull request against its base.
          fetch-depth: 0
          persist-credentials: false

      # Which component folders to test: on a pull request, the ones its changes reach
      # (empty when no test input changed); on main, all of them. First, so the image build
      # can start before lint. The runner's own python3 is enough: the script needs git only.
      - name: Which tests to run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 .github/scripts/test_scope.py --base "$BASE" --head "$HEAD" --github-output
          else
            python3 .github/scripts/test_scope.py --all --github-output
          fi

      - name: No test input changed
        if: steps.scope.outputs.suites == ''
        run: echo "No file the tests can see changed, so no tests run (.github/scripts/test_scope.py)."

      # The image build (airflow.Dockerfile, as `docker compose build test`) runs in the
      # background while Python, lint and the lock check run, and the test step waits for it.
      # The build is not cached across runs: on PR #194 a GitHub Actions layer cache made it
      # slower (69 s warm against 51 s from scratch), since loading the 2 GB image into Docker
      # cost 45 s (runbook, "CI").
      - name: Start the image build
        if: steps.scope.outputs.suites != ''
        run: |
          nohup sh -c 'docker compose build test > "$RUNNER_TEMP/build.log" 2>&1; echo $? > "$RUNNER_TEMP/build.rc"' > /dev/null 2>&1 &

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Check Python is 3.12
        run: python -c "import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 12))"

      # Lint first: it needs no dependencies, so a lint error fails in seconds.
      - name: Lint
        run: |
          pip install ruff==0.17.2
          ruff check --output-format=github .

      # Every code dependency in Data-Pipeline/dvc.lock and Model-Development/dvc.lock must match the
      # file in the tree (#111): the data version a model records is the sha256 of a lock, so a stale
      # lock would tie a model to code that is no longer there. Needs git and PyYAML only, no data.
      - name: Check dvc.lock against the tree
        run: |
          pip install PyYAML==6.0.3
          python Model-Development/scripts/lock_check.py

      - name: Wait for the image build
        if: steps.scope.outputs.suites != ''
        run: |
          while [ ! -f "$RUNNER_TEMP/build.rc" ]; do sleep 1; done
          cat "$RUNNER_TEMP/build.log"
          exit "$(cat "$RUNNER_TEMP/build.rc")"

      # The README and runbook command on the image just built (so no --build): prints the
      # Python version and stops unless it is 3.12, then runs the chosen folders' tests in
      # parallel and fails below the coverage bar in .coveragerc for each folder that ran.
      - name: Test (Airflow image, Python 3.12, coverage)
        if: steps.scope.outputs.suites != ''
        env:
          BRT_TEST_SUITES: ${{ steps.scope.outputs.suites }}
        run: docker compose run --rm test

      # The deployment contracts (#159): schemas, fixtures, cross-field rules and the fixture
      # tool's --check, in the image built above, without coverage. Runs whenever the image
      # was built; a change under docs/contracts/ is shared, so it always builds one.
      - name: Contract tests (#159)
        if: steps.scope.outputs.suites != ''
        run: docker compose run --rm test docs/contracts/tests --no-cov

  # terraform fmt and validate for both roots (#165): init skips the backend, so no state
  # is read and no Google credential is needed; it downloads the providers only.
  terraform:
    name: Terraform fmt and validate (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [Deployment/terraform, Deployment/terraform-project2]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  # Each new component gets its own image, its own coverage bar and its own caller job
  # (ADR-037, #159): the reusable workflow builds the component's `test` image from its
  # folder and runs the tests in it with no network, at a fixed 70 percent. The template
  # runs on every pull request, so the pattern is proven each time. No `needs`: it runs in
  # parallel with the job above.
  component-template:
    name: Component template
    uses: ./.github/workflows/component-ci.yml
    with:
      component: .github/component-template
      cov_source: component_template

  # The model service (#161, ADR-037). Its image copies the contract schemas and the training lock from
  # outside Serving/, so its build context is the repository root.
  serving:
    name: Serving
    uses: ./.github/workflows/component-ci.yml
    with:
      component: Serving
      context: .
      cov_source: serving /app/scripts

  # The one status check to require. It always runs, so it reports even when a job fails or
  # is cancelled, and it fails unless every job it needs succeeded. A new component adds its
  # caller job above and its job id to `needs` here: Model-Development/tests/test_ci_workflows.py
  # fails when a job is left out.
  ci:
    name: ci
    if: always()
    needs: [lint-and-test, terraform, component-template, serving]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate the result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "::error::a job did not succeed"; exit 1; }
