# CI v1 (#21): lint and tests on every pull request and every push to main.
# Lint runs on Python 3.12 from .python-version (ADR-013). The tests run with the
# documented test command (#38), in the Airflow image, so the DAG tests have
# Airflow and cannot skip. No secrets: the job reads nothing from the
# repository's secrets, the test container gets no keys and no network, and
# tests/conftest.py blocks network access so tests use fixture files only. The
# job name is the required status check on main (runbook, "CI").
#
# Speed (#165): the image build reuses its layers from the GitHub Actions cache,
# the tests run in parallel (run_tests.sh), and a pull request tests only the
# component folders its changes reach (.github/scripts/test_scope.py). Main, and a
# change to any shared file, still runs every test with both coverage bars. The
# Terraform job checks both roots' format and syntax with no cloud calls.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Python 3.12)
    runs-on: ubuntu-24.04
    # A cold image cache adds about a minute to the build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the scope step can diff a pull request against its base.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Check Python is 3.12
        run: python -c "import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 12))"

      # Lint first: it needs no dependencies, so a lint error fails in seconds.
      - name: Lint
        run: |
          pip install ruff==0.17.2
          ruff check --output-format=github .

      # Every code dependency in Data-Pipeline/dvc.lock and Model-Development/dvc.lock must match the
      # file in the tree (#111): the data version a model records is the sha256 of a lock, so a stale
      # lock would tie a model to code that is no longer there. Needs git and PyYAML only, no data.
      - name: Check dvc.lock against the tree
        run: |
          pip install PyYAML==6.0.3
          python Model-Development/scripts/lock_check.py

      # Which component folders to test: on a pull request, the ones its changes reach
      # (empty when no test input changed); on main, all of them.
      - name: Which tests to run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python .github/scripts/test_scope.py --base "$BASE" --head "$HEAD" --github-output
          else
            python .github/scripts/test_scope.py --all --github-output
          fi

      - name: No test input changed
        if: steps.scope.outputs.suites == ''
        run: echo "No file the tests can see changed, so no tests run (.github/scripts/test_scope.py)."

      # The same image as `docker compose build test` (brt-airflow:local from airflow.Dockerfile),
      # built with its layers saved to and read from the GitHub Actions cache, so an unchanged
      # Data-Pipeline/requirements.txt reuses the apt and pip layers instead of rebuilding them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.suites != ''

      - name: Build the Airflow image (cached layers)
        if: steps.scope.outputs.suites != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: airflow.Dockerfile
          tags: brt-airflow:local
          load: true
          cache-from: type=gha,scope=brt-airflow
          cache-to: type=gha,mode=max,scope=brt-airflow

      # The README and runbook command, on the image built above: prints the Python version
      # and stops unless it is 3.12, then runs the chosen folders' tests in parallel and fails
      # below the coverage bar in .coveragerc for each folder that ran.
      - name: Test (Airflow image, Python 3.12, coverage)
        if: steps.scope.outputs.suites != ''
        env:
          BRT_TEST_SUITES: ${{ steps.scope.outputs.suites }}
        run: docker compose run --rm test

  # terraform fmt and validate for both roots (#165): init skips the backend, so no state
  # is read and no Google credential is needed; it downloads the providers only.
  terraform:
    name: Terraform fmt and validate (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [Deployment/terraform, Deployment/terraform-project2]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color
