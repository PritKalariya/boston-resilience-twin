name: Task
description: One task, one owner, one reviewer, one due date
title: "[W<n>-<m>] "
body:
  - type: input
    id: owner
    attributes:
      label: Owner
      description: One GitHub handle. Also set the Assignee and the phase label in the sidebar.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: The person whose next issue depends on this one. Not the owner.
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - setup
        - ingestion
        - processing
        - decision
        - quality
        - model
        - deploy
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Each item is a command to run or a state to observe.
      value: "- [ ] "
    validations:
      required: true
