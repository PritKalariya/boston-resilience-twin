# Local Airflow stack: Airflow 3.3.2 with LocalExecutor and a Postgres 16 metadata DB,
# and the MLflow tracking server (#104), which starts only when asked for (profile mlflow).
# macOS and Windows: works on a clean clone with no .env. Linux: put AIRFLOW_UID in
# .env first (README). Defaults are for local use only. On airflow-vm none of them
# apply: its startup script renders .env from Secret Manager at every boot (runbook,
# "Airflow on the VM", "Secrets on the VM"; ADR-034).
# Adapted from the official Airflow 3.3.2 docker-compose.yaml (Apache License 2.0):
# https://airflow.apache.org/docs/apache-airflow/3.3.2/docker-compose.yaml

x-airflow-common:
  &airflow-common
  # Built from airflow.Dockerfile (ADR-022): the apache/airflow:3.3.2-python3.12
  # base image (Python 3.12 per ADR-013; the unsuffixed 3.3.2 tag is Python 3.13)
  # plus Data-Pipeline/requirements.txt and libgomp1 for LightGBM (#107).
  # Rebuild with `docker compose up -d --build --wait`
  # after changing that file; DAG and script changes need no rebuild.
  image: brt-airflow:local
  build:
    context: .
    dockerfile: airflow.Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
    # Task processes call the Execution API on the API server.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # The next three must match in every container. There is no shared airflow.cfg,
    # so unset values would differ per container. Empty Fernet key: no encryption (local only; the VM's comes from Secret Manager, ADR-034).
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-dev-only-jwt-secret-do-not-use-on-the-vm-0123456789abcdef0123456789}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-dev-only-api-secret-key-do-not-use-on-the-vm-0123456789abcdef012345}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    # LocalExecutor pre-forks this many workers (default 32). The 4-wide legacy parse
    # measured 1074 MiB available at its low on e2-medium, against a 500 MB floor; heavy
    # tasks are serialized by the heavy_memory pool instead (runbook, "Memory budget
    # on airflow-vm"; ADR-031).
    AIRFLOW__CORE__PARALLELISM: '4'
    # 1 is the 3.3.2 default; pinned so an upgrade cannot raise it.
    AIRFLOW__API__WORKERS: '1'
    # Pick up new DAG files within 30 s (default 300).
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '30'
    # Scheduler serves /health on port 8974 for its healthcheck.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Pipeline DAGs import Data-Pipeline/scripts by module name (ADR-017, #22).
    PYTHONPATH: /opt/airflow/repo/Data-Pipeline/scripts
    # API keys from .env (#4). Empty when unset, so the stack still starts;
    # credentials.require fails the task that needs one, naming the key.
    NOAA_CDO_TOKEN: ${NOAA_CDO_TOKEN:-}
    CENSUS_API_KEY: ${CENSUS_API_KEY:-}
    NWS_USER_AGENT: ${NWS_USER_AGENT:-}
    # Slack incoming webhook for failure alerts (#34), from .env. Empty: alerts go
    # to the task log only. On the VM it comes from Secret Manager at boot (ADR-034).
    SLACK_ALERT_WEBHOOK: ${SLACK_ALERT_WEBHOOK:-}
    # Legacy 311 years parsed at once (#37). Put LEGACY_PARALLEL=2 in .env if memory is tight.
    LEGACY_PARALLEL: ${LEGACY_PARALLEL:-4}
    # The MLflow server for runs logged from a task (#104), from .env: http://mlflow:5000.
    # Empty: runs go to a local store instead (Model-Development/scripts/tracking.py).
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    # Docker creates /opt/airflow/repo as root, so git run as AIRFLOW_UID inside a
    # container calls the repo "dubious ownership". git reads this as `safe.directory`.
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /opt/airflow/repo
  volumes:
    - ./Data-Pipeline/dags:/opt/airflow/dags/data_pipeline
    - ./Data-Pipeline/logs:/opt/airflow/logs
    # The repo layout under /opt/airflow/repo, so tasks build the same paths as on
    # the host. Data-Pipeline is one read-only directory mount (ADR-029), so a
    # `git pull` on the host reaches the containers: a single-file mount keeps the
    # pre-pull inode of dvc.yaml and dvc.lock. Only data is written, so its mount
    # nests inside as read-write. The category map is read-only.
    - ./Data-Pipeline:/opt/airflow/repo/Data-Pipeline:ro
    - ./Data-Pipeline/data:/opt/airflow/repo/Data-Pipeline/data
    - ./docs/data:/opt/airflow/repo/docs/data:ro
    # DVC for the push_data task (#19): DVC refuses to run outside a git repo, so
    # .git is mounted read-only; .dvc is writable for DVC's cache and tmp files.
    # push_data pushes the outputs the committed Data-Pipeline/dvc.lock names (#18).
    - ./.git:/opt/airflow/repo/.git:ro
    - ./.dvc:/opt/airflow/repo/.dvc
    - ./.dvcignore:/opt/airflow/repo/.dvcignore:ro
  # Linux: set AIRFLOW_UID to `id -u` in .env. The image requires group 0.
  user: "${AIRFLOW_UID:-50000}:0"
  # Cap container stdout logs (the VM disk is 30 GB).
  logging:
    &default-logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    # No ports: reachable only inside the compose network.
    # No mem_limit; the OOM killer takes a task before the database (ADR-031).
    oom_score_adj: -500
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # One-shot. The image entrypoint migrates the DB and creates the UI admin
    # (_AIRFLOW_* below) but ignores migrate errors, so check-migrations sets the exit code.
    # chown fixes log and data ownership on Linux (a checkout owned by another user);
    # Windows bind mounts ignore it.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow db check-migrations
        status=$$?
        # The heavy_memory pool (ADR-031). `pools set` updates an existing pool, so a rerun exits 0.
        # Through /entrypoint: init runs as root, where a bare `airflow` cannot import airflow.
        if [ $$status -eq 0 ]; then /entrypoint airflow pools set heavy_memory 1 "Heavy tasks run one at a time on airflow-vm (ADR-031)"; status=$$?; fi
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/repo/Data-Pipeline/data || echo "chown skipped"
        exit $$status
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    mem_limit: 768m  # ADR-031

  airflow-apiserver:
    <<: *airflow-common
    mem_limit: 512m  # ADR-031
    command: api-server
    # Localhost only. On the VM, reach it through an SSH tunnel.
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    # Also runs the tasks (LocalExecutor), so it waits for the Execution API.
    command: scheduler
    mem_limit: 2560m  # ADR-031: tasks run here; sized above the build's anonymous-memory peak, page cache is reclaimed at the limit
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    mem_limit: 640m  # ADR-031
    healthcheck:
      # A CLI check costs a few CPU seconds, so it runs once a minute.
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
      start_interval: 10s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # MLflow tracking server (#104, ADR-006): parameters, metrics and artifacts of every
  # training and tuning run, and later the agents' traces; MLflow's model registry is not
  # used. Off by default, so `docker compose up` and airflow-vm do not start it (#61):
  # `docker compose --profile mlflow up -d --wait` or `docker compose up -d --wait mlflow`
  # does, and so does the smoke check below. Nothing depends on it: with MLFLOW_TRACKING_URI
  # unset, runs go to Model-Development/mlruns/ instead (Model-Development/scripts/tracking.py).
  mlflow:
    # The official image, the same version as the mlflow client in
    # Data-Pipeline/requirements.txt (Model-Development/tests/test_mlflow_service.py keeps them
    # equal). Its Python is 3.11; it runs no project code, so ADR-013 does not apply, as for Postgres.
    image: ghcr.io/mlflow/mlflow:v3.17.2
    # In smoke too, so `docker compose run mlflow-smoke` can start it.
    profiles: ["mlflow", "smoke"]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      # One worker process; the default 4 would each take about 240 MiB.
      - --workers=1
      # Runs in SQLite and artifacts on disk, both in the mount below. Clients send artifacts
      # through the server, so they need no access to the folder.
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      # Host headers the server answers (DNS rebinding protection): the compose name for other
      # containers and localhost on any port for the UI. Without "mlflow" every API call from
      # another container gets 403 while /health still answers.
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    environment:
      # Off: job execution adds 7 worker processes (1.6 GiB in all, measured) for GenAI
      # online scoring and trace archival, which the project does not use.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    # Localhost only (ADR-016). On the VM, reach it through an SSH tunnel.
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5000}:5000"
    # Gitignored. Its .gitkeep makes the checkout own the folder; on Linux, Docker would
    # create a missing one as root and the server could not write to it.
    volumes:
      - ./Model-Development/mlflow:/mlflow
    # The image runs as root; as with Airflow, the files it writes belong to AIRFLOW_UID (ADR-029).
    user: "${AIRFLOW_UID:-50000}:0"
    # Measured on 2026-11-09: 365 MiB idle, 380 MiB at peak while 3 runs logged 600 metric
    # values and 60 MB of artifacts.
    mem_limit: 512m
    healthcheck:
      # The image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 5s
    logging: *default-logging
    restart: unless-stopped

  # Smoke check of the tracking server (#104): `docker compose run --rm --build mlflow-smoke`.
  # From another container on the compose network, as a task or a training run would, it logs
  # one run with a parameter, a metric and an artifact through MLFLOW_TRACKING_URI, reads them
  # back and prints the run's page in the UI. The Airflow image gives Python 3.12 (ADR-013) and
  # the mlflow client that training uses. The profile keeps it out of `docker compose up`; only
  # the scripts it runs are mounted, read-only, and no .env value reaches it.
  mlflow-smoke:
    image: brt-airflow:local
    build:
      context: .
      dockerfile: airflow.Dockerfile
    profiles: ["smoke"]
    entrypoint: ["python", "Model-Development/scripts/mlflow_smoke.py"]
    working_dir: /opt/airflow/repo
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BRT_MLFLOW_UI_URL: http://127.0.0.1:${MLFLOW_HOST_PORT:-5000}  # the link it prints, as the host's browser sees it
      PYTHONDONTWRITEBYTECODE: "1"  # the scripts are read-only
    volumes:
      - ./Model-Development/scripts:/opt/airflow/repo/Model-Development/scripts:ro
    depends_on:
      mlflow:
        condition: service_healthy
    user: "${AIRFLOW_UID:-50000}:0"
    logging: *default-logging

  # The full test suite with coverage (#38): `docker compose run --rm --build test`.
  # The Airflow image gives Python 3.12 (ADR-013) and Airflow for the DAG tests, so
  # the host needs no Python. The profile keeps it out of `docker compose up`, and it
  # starts nothing else. No anchor: no database, no API keys and no .env reach it,
  # and it has no network (conftest.py already fails a test that tries). Only what
  # the tests read is mounted, read-only, and an empty folder hides
  # Data-Pipeline/data, so a run on a laptop sees what CI sees. Arguments replace
  # the full suite and go to pytest, for example
  # `docker compose run --rm test Data-Pipeline/tests/test_dvc_push.py --no-cov`.
  test:
    image: brt-airflow:local
    build:
      context: .
      dockerfile: airflow.Dockerfile
    profiles: ["test"]
    entrypoint: ["bash", "Data-Pipeline/tests/run_tests.sh"]
    working_dir: /opt/airflow/repo
    network_mode: none
    environment:
      PYTHONPATH: /opt/airflow/repo/Data-Pipeline/scripts  # as in the stack, so the DAGs import the same way
      PYTHONDONTWRITEBYTECODE: "1"  # the repo is read-only
      COVERAGE_FILE: /tmp/.coverage
      GIT_CONFIG_COUNT: "1"  # as in the stack: /opt/airflow/repo is root-owned inside the container
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /opt/airflow/repo
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      BRT_TEST_SERVICE: "1"  # the DAG tests fail instead of skipping when Airflow is missing
    volumes:
      - ./Data-Pipeline:/opt/airflow/repo/Data-Pipeline:ro
      - ./Model-Development:/opt/airflow/repo/Model-Development:ro
      - ./.github:/opt/airflow/repo/.github:ro  # model.yml and in_image.sh, for test_steps_workflow.py (#112)
      - ./docs/data:/opt/airflow/repo/docs/data:ro
      - ./.coveragerc:/opt/airflow/repo/.coveragerc:ro
      - ./.env.example:/opt/airflow/repo/.env.example:ro
      - ./.dvc/config:/opt/airflow/repo/.dvc/config:ro  # the remote URL only, not DVC's cache
      - ./docker-compose.yaml:/opt/airflow/repo/docker-compose.yaml:ro  # for the mlflow service checks (#104)
    tmpfs:
      - /opt/airflow/repo/Data-Pipeline/data
    user: "${AIRFLOW_UID:-50000}:0"
    logging: *default-logging

volumes:
  postgres-db-volume:
